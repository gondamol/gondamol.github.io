execute:
  freeze: auto
  echo: true
  warning: false
  message: false

format:
  html:
    theme:
      light: [flatly, custom.scss, styles.scss]
    toc: false
    code-fold: true
    code-tools: true
    code-copy: true
    link-external-newwindow: true
    smooth-scroll: true
    include-after-body:
      - _includes/theme-toggle.html
      - _includes/site-enhancements.html
    include-in-header:
      text: |
        <script>
          (function() {
            try {
              var storageKey = 'nic-site-theme';
              var storedTheme = localStorage.getItem(storageKey);
              var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
              var theme = storedTheme || (prefersDark ? 'dark' : 'light');
              document.documentElement.setAttribute('data-theme', theme);
              document.documentElement.style.colorScheme = theme;
            } catch (error) {
              document.documentElement.setAttribute('data-theme', 'light');
              document.documentElement.style.colorScheme = 'light';
            }
          })();
        </script>
        <meta name="color-scheme" content="light dark">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&family=DM+Mono:wght@400&family=Noto+Sans+Condensed:wght@300;400;600;700&display=swap" rel="stylesheet">

editor: source
